<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; URL=/" />
    <script>
      // Redirect to the correct route
      var path = window.location.pathname;
      if (path !== "/") {
        window.location.replace("/#" + path);
      }
    </script>
  </head>
  <body></body>
</html>
